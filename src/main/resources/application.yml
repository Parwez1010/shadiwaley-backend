server:
  port: 8080

spring:
  application:
    name: shadiwaley-server

  datasource:
    url: jdbc:postgresql://localhost:5432/shadiwaley_db
    username: postgres
    password: ParwezSql@123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
    secret: change-this-to-a-long-secure-secret-key-at-least-64-bytes

  otp:
    expiry-minutes: 5
    resend-cooldown-seconds: 30
    max-attempts: 5
    return-otp-in-response: true

  bootstrap:
    super-admin:
      enabled: true
      email: superadmin@shadiwaley.com
      password: SuperAdmin@123
      full-name: Shadiwaley Super Admin

  storage:
    local-upload-dir: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info